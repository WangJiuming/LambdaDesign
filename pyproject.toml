[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdadesign-inference"
version = "1.0.1"
description = "Inference for LambdaDesign ionizable lipid activity scoring and generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/lambdadesign/licenses/MOLCLR.txt"]
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.6,<3",
    "numpy>=1.26,<3",
    "rdkit>=2024.9,<2027",
    "selfies>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
lambdadesign = "lambdadesign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lambdadesign = ["licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
